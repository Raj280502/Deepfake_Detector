{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepTalks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #181a1b;
        color: #e0e0e0;
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        position: relative;
      }
      .navbar {
        background-color: #23272b !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        border-radius: 0 0 1rem 1rem;
      }
      .navbar-brand span {
        font-weight: 600;
        letter-spacing: 2px;
        font-size: 2rem;
      }
      .navbar-brand img {
        height: 48px;
        width: 48px;
        object-fit: cover;
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      .container {
        margin-top: 2rem;
        margin-bottom: 2rem;
      }
      .glass-card {
        background: rgba(35,39,43,0.7);
        box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
        border-radius: 1.5rem;
        border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(6px);
      }
      .form-control, .form-label {
        background-color: #23272b;
        color: #e0e0e0;
        border-color: #343a40;
      }
      .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
        background-color: #23272b;
        color: #e0e0e0;
      }
      .btn-primary {
        background-color: #0d6efd;
        border-color: #0d6efd;
        font-weight: 600;
        letter-spacing: 1px;
        box-shadow: 0 2px 8px rgba(13,110,253,0.15);
      }
      .btn-primary:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
      }
      .alert-info {
        background: rgba(13,110,253,0.15);
        color: #e0e0e0;
        border: 1px solid #0d6efd;
        border-radius: 1rem;
      }
      .video-fit {
        max-width: 100%;
        max-height: 400px;
        width: auto;
        height: auto;
        display: block;
        margin: 0 auto;
      }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4 position-relative">
  <div class="container justify-content-center">
    <a class="navbar-brand d-flex align-items-center gap-2 mx-auto" href="#">
      <img src="{% static 'aad.webp' %}" alt="Logo">
      <span>DeepTalks</span>
    </a>
  </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
